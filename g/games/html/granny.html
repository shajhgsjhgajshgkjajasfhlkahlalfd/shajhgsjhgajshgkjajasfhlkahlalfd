<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Granny</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090909;color:#eee;font-family:system-ui,sans-serif}
#unityContainer{width:100%;height:100%}
#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#111;z-index:10;padding:24px;box-sizing:border-box;text-align:center}
h1{margin:0 0 16px}#status{max-width:720px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}progress{width:min(440px,90vw);margin:20px}button{padding:12px 24px;font:inherit;cursor:pointer}#note{color:#aaa;max-width:600px;font-size:14px}
</style>
</head>
<body>
<div id="unityContainer"></div>
<div id="loading" role="status" aria-live="polite"><h1>Granny</h1><div id="status">Preparing game…</div><progress id="progress"></progress><p id="note">The game downloads a large set of files. Keep this tab open while it loads. Internet access is required.</p><button id="retry" hidden>Retry</button></div>
<script>
'use strict';
const BASE='https://cdn.jsdelivr.net/gh/web-ports/granny@main/';
const statusText=document.getElementById('status');
const progress=document.getElementById('progress');
const overlay=document.getElementById('loading');
const retry=document.getElementById('retry');
const urls=[];
let failed=false;
function fail(error){
  if(failed)return;
  failed=true;
  overlay.style.display='flex';
  statusText.textContent='The game could not start.\n'+(error.message||String(error))+'\n\nCheck your connection and whether the game CDN is blocked. If a file is missing on the host, the game owner must restore it.';
  progress.hidden=true;retry.hidden=false;
}
retry.onclick=()=>location.reload();
window.addEventListener('error',e=>{if(e.error)fail(e.error)});
window.addEventListener('unhandledrejection',e=>fail(e.reason||new Error('Unknown loading error')));
async function download(path,kind='blob'){
  const url=new URL(path,BASE).href;
  let last;
  for(let attempt=0;attempt<3;attempt++){
    const controller=new AbortController();
    const timeout=setTimeout(()=>controller.abort(),180000);
    try{
      const response=await fetch(url,{signal:controller.signal});
      if(!response.ok)throw new Error('HTTP '+response.status+' for '+url);
      const value=kind==='json'?await response.json():await response.blob();
      if(kind==='blob'&&!value.size)throw new Error('Empty file: '+url);
      return value;
    }catch(e){last=e;if(attempt<2)await new Promise(r=>setTimeout(r,1000*(attempt+1)));}
    finally{clearTimeout(timeout);}
  }
  throw new Error('Download failed: '+url+'\n'+last.message);
}
function loadScript(url){return new Promise((resolve,reject)=>{
  const script=document.createElement('script');
  const timer=setTimeout(()=>{script.remove();reject(new Error('Loader timed out: '+url))},90000);
  script.src=url;script.onload=()=>{clearTimeout(timer);resolve()};
  script.onerror=()=>{clearTimeout(timer);reject(new Error('Could not load Unity loader: '+url))};
  document.head.appendChild(script);
})}
function blobURL(blob){const url=URL.createObjectURL(blob);urls.push(url);return url}
async function start(){
  if(!window.WebAssembly)throw new Error('This browser does not support WebAssembly.');
  statusText.textContent='Loading game configuration…';
  const manifestURL=new URL('Build/GrannyPortButBetter.json',BASE);
  const config=await download(manifestURL.href,'json');
  await loadScript(new URL('Build/UnityLoader.js',BASE).href);
  if(!window.UnityLoader)throw new Error('UnityLoader was not provided by the downloaded script.');
  const parts=new Array(29);let next=0,done=0,bytes=0;
  progress.max=29;progress.value=0;
  async function worker(){
    while(next<parts.length){
      const index=next++;
      parts[index]=await download('Build/GrannyPortButBetter.data.unityweb.part'+(index+1));
      bytes+=parts[index].size;done++;
      progress.value=done;
      statusText.textContent='Downloading game: '+done+'/29 files ('+(bytes/1048576).toFixed(1)+' MiB)';
    }
  }
  await Promise.all(Array.from({length:3},()=>worker()));
  const dataURL=blobURL(new Blob(parts,{type:'application/octet-stream'}));
  parts.fill(null);
  for(const key of Object.keys(config)){
    if(/url$/i.test(key)&&typeof config[key]==='string'&&config[key])config[key]=new URL(config[key],manifestURL).href;
  }
  config.dataUrl=dataURL;
  const configURL=blobURL(new Blob([JSON.stringify(config)],{type:'application/json'}));
  statusText.textContent='Starting Unity…';
  progress.max=1;progress.value=0;
  window.unityInstance=UnityLoader.instantiate('unityContainer',configURL,{
    onProgress:(instance,value)=>{
      if(failed)return;
      progress.value=value;
      statusText.textContent='Starting game: '+Math.round(value*100)+'%';
      if(value>=1)overlay.style.display='none';
    }
  });
}
start().catch(fail);
window.addEventListener('pagehide',()=>urls.forEach(url=>URL.revokeObjectURL(url)));
</script>
</body>
</html>
