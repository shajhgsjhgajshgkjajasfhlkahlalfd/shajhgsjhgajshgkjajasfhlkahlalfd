<html lang="en-us">
<head>
  <base href="https://cdn.jsdelivr.net/gh/web-ports/granny@main/">

  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <script src="TemplateData/UnityProgress.js"></script>
  <script src="Build/UnityLoader.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100%;
      width: 100%;
      background: black;
    }

    #unityContainer {
      width: 100vw;
      height: 100vh;
    }

  #loading-text {
  font-weight: bold;
  background: linear-gradient(
    270deg,
    #ff0000,
    #ff7f00,
    #ffff00,
    #00ff00,
    #0000ff,
    #4b0082,
    #8f00ff
  );
  background-size: 400% 400%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: rainbow 3s ease infinite;
}

@keyframes rainbow {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
  </style>
</head>
<body>
<div id="loading-text"
    style="color: white; font-size: 48px; font-family: cursive; text-align: center; margin-top: 20px;"> LOADING...
  </div>
  <script>
    const loadingText = document.getElementById("loading-text");
    const PART_COUNT = 29;
    const DATA_FILE = "Build/GrannyPortButBetter.data.unityweb";
    let loadedBytes = 0;

    function showLoading(message) {
      if (loadingText) loadingText.textContent = message;
    }

    async function fetchPart(url, index) {
      const response = await fetch(url, { cache: "force-cache" });
      if (!response.ok) {
        throw new Error(`Could not load data part ${index} (HTTP ${response.status}).`);
      }
      // Keep each part as a Blob. Do not copy every part into one giant
      // Uint8Array; that duplicate allocation was causing memory exceptions.
      const blob = await response.blob();
      loadedBytes += blob.size;
      showLoading(`LOADING... ${(loadedBytes / 1048576).toFixed(1)} MB loaded`);
      return blob;
    }

    async function loadGame() {
      try {
        const parts = [];
        // Fetch one part at a time to avoid 29 simultaneous downloads and
        // their temporary buffers overwhelming lower-memory devices.
        for (let i = 1; i <= PART_COUNT; i++) {
          showLoading(`LOADING... downloading data ${i}/${PART_COUNT}`);
          parts.push(await fetchPart(`${DATA_FILE}.part${i}`, i));
        }

        showLoading("LOADING... preparing game");
        // Blob composition avoids the extra full-size Uint8Array copy.
        const dataBlob = new Blob(parts, { type: "application/octet-stream" });
        parts.length = 0;
        const dataUrl = URL.createObjectURL(dataBlob);

        const originalOpen = XMLHttpRequest.prototype.open;
        XMLHttpRequest.prototype.open = function (method, url, ...rest) {
          if (String(url).includes("GrannyPortButBetter.data.unityweb")) {
            url = dataUrl;
          }
          return originalOpen.call(this, method, url, ...rest);
        };

        showLoading("LOADING... starting Unity");
        window.unityInstance = UnityLoader.instantiate(
          "unityContainer",
          "Build/GrannyPortButBetter.json",
          {
            onProgress: function (instance, progress) {
              if (typeof window.UnityProgress === "function") {
                window.UnityProgress(instance, progress);
              }
              if (progress >= 1) {
                showLoading("LOADING... finishing up");
                // Let Unity finish its final frame before hiding the message.
                setTimeout(() => loadingText && loadingText.remove(), 500);
              }
            }
          }
        );
      } catch (error) {
        console.error("Game failed to load:", error);
        showLoading("COULDN'T LOAD GAME — " + (error && error.message ? error.message : "unknown error") + " Refresh to try again.");
        if (loadingText) {
          loadingText.style.background = "none";
          loadingText.style.webkitTextFillColor = "#ff6666";
          loadingText.style.color = "#ff6666";
          loadingText.style.fontSize = "20px";
          loadingText.style.padding = "24px";
        }
      }
    }

    window.addEventListener("load", loadGame, { once: true });
  </script>
  <div id="unityContainer"></div>
</body>
</html>
