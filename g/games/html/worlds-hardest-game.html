
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>The World's Hardest Game</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
      height: 100%;
      width: 100%;
    }

    #flash-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #000;
      overflow: hidden;
    }

    .black-box {
      position: fixed;
      background: #000;
      z-index: 10;
      pointer-events: none;
    }

    #box-top {
      top: 0;
      left: 0;
      width: 100%;
      height: 0;
    }

    #box-bottom {
      bottom: 0;
      left: 0;
      width: 100%;
      height: 0;
    }

    #box-left {
      top: 0;
      left: 0;
      width: 0;
      height: 100%;
    }

    #box-right {
      top: 0;
      right: 0;
      width: 0;
      height: 100%;
    }

    ruffle-player {
      display: block;
      width: 100%;
      height: 100%;
      background: #000;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle@0.2.0-nightly.2025.10.2/ruffle.min.js"></script>
</head>

<body>
  <div id="flash-container"></div>
  <div class="black-box" id="box-top"></div>
  <div class="black-box" id="box-bottom"></div>
  <div class="black-box" id="box-left"></div>
  <div class="black-box" id="box-right"></div>

  <script>
    const container = document.getElementById("flash-container");
    const boxTop = document.getElementById("box-top");
    const boxBottom = document.getElementById("box-bottom");
    const boxLeft = document.getElementById("box-left");
    const boxRight = document.getElementById("box-right");

    function resizeGame() {
      const windowWidth = window.innerWidth;
      const windowHeight = window.innerHeight;
      const aspectRatio = 5.5 / 3;

      let width = windowWidth;
      let height = width / aspectRatio;

      if (height > windowHeight) {
        height = windowHeight;
        width = height * aspectRatio;
      }

      container.style.width = `${Math.floor(width)}px`;
      container.style.height = `${Math.floor(height)}px`;

      const topMargin = Math.max(0, (windowHeight - height) / 2);
      const leftMargin = Math.max(0, (windowWidth - width) / 2);

      boxTop.style.height = `${topMargin}px`;
      boxBottom.style.height = `${topMargin}px`;
      boxLeft.style.width = `${leftMargin}px`;
      boxRight.style.width = `${leftMargin}px`;
    }

    async function startGame() {
      resizeGame();

      try {
        if (!window.RufflePlayer) {
          throw new Error("Ruffle failed to load.");
        }

        const ruffle = window.RufflePlayer.newest();
        const player = ruffle.createPlayer();

        player.style.width = "100%";
        player.style.height = "100%";
        player.style.background = "#000";

        container.appendChild(player);

        await player.load(
          "https://cdn.jsdelivr.net/gh/sonvallhall/x7x@51cffb21c08c2ca9cecbed7aecf10d1afb8b9c72/wordes-hardest-gae.swf"
        );
      } catch (error) {
        console.error("Game loading failed:", error);
        container.textContent = "Could not load game.";
        container.style.color = "#fff";
      }
    }

    window.addEventListener("resize", resizeGame);
    window.addEventListener("DOMContentLoaded", startGame);
  </script>
</body>
</html>
