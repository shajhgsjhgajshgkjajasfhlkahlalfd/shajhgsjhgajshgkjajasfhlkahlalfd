<!DOCTYPE html>
<html lang="en-us">
  <head>
    <base href="https://cdn.jsdelivr.net/gh/web-ports/fnae@afd4e5071add297d6169665a4f999d62f312532e/">
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | Five Night's at BIG E</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
      <style>
      html, body { margin: 0; min-height: 100%; background: #000; }
      #unity-container { width: 100%; max-width: 960px; margin: 0 auto; }
      #unity-canvas { display: block; width: 100%; height: auto; max-height: calc(100vh - 100px); object-fit: contain; background: #000; }
      #unity-loading-bar { max-width: 80%; margin: 0 auto; }
    </style>
  </head>
  <body>
  <div id="loading-text"
    style="color: white; font-size: 48px; font-family: cursive; text-align: center; margin-top: 20px;"> LOADING...
  </div>
    <div id="unity-container">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
    </div>
    <script>
      const loadingText = document.getElementById("loading-text");
      const loadingBar = document.getElementById("unity-loading-bar");
      const progressBar = document.getElementById("unity-progress-bar-full");
      const canvas = document.getElementById("unity-canvas");

      // Initialize diagnostics before any async startup checks can use them.
      window.__fnaeDiagnostics = [];
      function addDiagnostic(label, detail) {
        if (!Array.isArray(window.__fnaeDiagnostics)) window.__fnaeDiagnostics = [];
        const message = `${label}: ${detail}`;
        window.__fnaeDiagnostics.push(message);
        let panel = document.getElementById("unity-diagnostics");
        if (!panel) {
          panel = document.createElement("div");
          panel.id = "unity-diagnostics";
          panel.style.cssText = "color:#fff;max-width:900px;margin:12px auto;padding:14px;background:#191919;border:1px solid #555;border-radius:8px;font:13px/1.45 monospace;white-space:pre-wrap;overflow-wrap:anywhere;text-align:left;";
          loadingText.insertAdjacentElement("afterend", panel);
        }
        panel.textContent = "DIAGNOSTICS\\n" + window.__fnaeDiagnostics.slice(-8).join("\\n");
      }

      const ROOT = new URL("./fnae-assets/", window.location.href).href;
      const PARTS = [
        { key: "data", path: "Build/fnae.data", count: 3 },
        { key: "wasm", path: "Build/fnae.wasm", count: 2 },
        { key: "video", path: "StreamingAssets/202512191935.webm", count: 3 }
      ];

      function showError(message) {
        loadingText.textContent = "GAME COULD NOT LOAD";
        loadingText.style.color = "#ff7777";
        let details = document.getElementById("load-error");
        if (!details) {
          details = document.createElement("pre");
          details.id = "load-error";
          details.style.cssText = "color:#fff;white-space:pre-wrap;overflow-wrap:anywhere;max-width:900px;margin:18px auto;padding:16px;font:14px monospace;text-align:left;background:#211;";
          loadingText.insertAdjacentElement("afterend", details);
        }
        details.textContent = message + "\n\nThis build expects the game assets in a same-origin folder named fnae-assets beside this HTML file. Upload the required Build and StreamingAssets files there in your GitHub Pages repository. A 404 means a required asset is missing or its path is incorrect.";
        console.error(message);
      }

      async function fetchPart(url) {
        // Try jsDelivr first, then GitHub's raw host in case the CDN is blocked.
        const candidates = [url];
        const prefix = "https://cdn.jsdelivr.net/gh/web-ports/fnae@afd4e5071add297d6169665a4f999d62f312532e/";
        if (url.startsWith(prefix)) {
          const relativePath = url.slice(prefix.length);
          candidates.push(
            "https://raw.githubusercontent.com/web-ports/fnae/afd4e5071add297d6169665a4f999d62f312532e/" + relativePath
          );
        }

        let lastError;
        for (const candidate of candidates) {
          try {
            const response = await fetch(candidate, { cache: "no-store" });
            if (!response.ok) {
              lastError = new Error(`HTTP ${response.status} while downloading ${candidate}`);
              continue;
            }
            return await response.arrayBuffer();
          } catch (error) {
            lastError = new Error(
              `Browser could not fetch: ${candidate}\nReason: ${error && error.message ? error.message : String(error)}`
            );
          }
        }
        throw lastError || new Error("Download failed for an unknown reason.");
      }

      async function mergeParts(path, count) {
        const buffers = [];
        let total = 0;
        for (let i = 1; i <= count; i++) {
          loadingText.textContent = `LOADING... downloading ${path.split("/").pop()} (${i}/${count})`;
          const buffer = await fetchPart(`${ROOT}${path}.part${i}`);
          buffers.push(buffer);
          total += buffer.byteLength;
        }
        const merged = new Uint8Array(total);
        let offset = 0;
        for (const buffer of buffers) {
          merged.set(new Uint8Array(buffer), offset);
          offset += buffer.byteLength;
        }
        return URL.createObjectURL(new Blob([merged]));
      }

      (async function startGame() {
        try {
          // Download sequentially to avoid multiple large allocations at once.
          const dataUrl = await mergeParts("Build/fnae.data", 3);
          const wasmUrl = await mergeParts("Build/fnae.wasm", 2);
          const videoUrl = await mergeParts("StreamingAssets/202512191935.webm", 3);
          window.randomwebm = videoUrl;

          // The game requests an MP4, but the hosted asset is a WebM file.
          const originalSrc = Object.getOwnPropertyDescriptor(HTMLMediaElement.prototype, "src");
          if (originalSrc && originalSrc.set && originalSrc.get) {
            Object.defineProperty(HTMLMediaElement.prototype, "src", {
              configurable: true,
              get() { return originalSrc.get.call(this); },
              set(value) {
                if (typeof value === "string" && value.includes("202512191935.mp4")) {
                  value = window.randomwebm;
                }
                originalSrc.set.call(this, value);
              }
            });
          }

          const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
          if (isMobile) {
            const meta = document.createElement("meta");
            meta.name = "viewport";
            meta.content = "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";
            document.head.appendChild(meta);
          }

          const config = {
            arguments: [],
            dataUrl,
            frameworkUrl: ROOT + "Build/fnae.framework.js",
            codeUrl: wasmUrl,
            streamingAssetsUrl: ROOT + "StreamingAssets",
            companyName: "DefaultCompany",
            productName: "fnae",
            productVersion: "1.0",
            // Prefer stability on lower-memory Chromebooks.
            matchWebGLToCanvasSize: true,
            devicePixelRatio: 1,
            showBanner(message) {
              if (typeof addDiagnostic === "function") {
                addDiagnostic("Unity message", String(message));
                if (String(message).includes("framework.js")) {
                  addDiagnostic("Framework check", "This version loads the framework from the same-origin fnae-assets/Build/ folder in your GitHub Pages site.");
                }
              }
            }
          };

          loadingBar.style.display = "block";
          const loaderPaths = [ROOT + "Build/fnae.loader.js"];

          function loadUnityLoader(index = 0) {
            if (index >= loaderPaths.length) {
              showError(
                "The Unity loader failed on all CDN endpoints:\n" +
                loaderPaths.join("\n") +
                "\n\nThe loader exists in the source repository, so this may be a CDN/network issue. " +
                "If these hosts are blocked on your network, host fnae.loader.js in your own game's repository and load it from there."
              );
              return;
            }

            const loader = document.createElement("script");
            loader.crossOrigin = "anonymous";
            loader.src = loaderPaths[index];
            loader.onload = async () => {
              try {
                if (typeof createUnityInstance !== "function") {
                  throw new Error("The Unity loader downloaded, but createUnityInstance was not defined.");
                }

                loadingText.textContent = "STARTING GAME... 90%";
                let lastProgress = 0;
                const instance = await createUnityInstance(canvas, config, progress => {
                  lastProgress = progress;
                  const percent = Math.round(progress * 100);
                  progressBar.style.width = `${percent}%`;
                  loadingText.textContent = `STARTING GAME... ${percent}%`;
                });

                // Some Unity builds reach the final progress stage but take a while
                // to finish post-load initialization. Only hide the UI after the
                // instance promise actually resolves.
                if (!instance) {
                  throw new Error("Unity finished loading assets but did not return a game instance.");
                }
                loadingBar.style.display = "none";
                loadingText.remove();
              } catch (error) {
                showError(
                  "Unity initialization failed after the download stage. " +
                  "This can be caused by a WebAssembly compile error, insufficient memory, " +
                  "or a failed Unity runtime/asset initialization.\n\n" +
                  (error && error.message ? error.message : String(error))
                );
              }
            };
            loader.onerror = () => {
              loader.remove();
              loadUnityLoader(index + 1);
            };
            document.head.appendChild(loader);
          }

          loadUnityLoader();

          // If Unity's promise never resolves, show a diagnostic instead of an
          // indefinite 90% screen. This does not cancel loading or reload the game.
          // On-page diagnostic event capture for devices without a developer console.
          window.addEventListener("error", event => {
            addDiagnostic("Browser error", event.message || "Unknown script/runtime error");
          });
          window.addEventListener("unhandledrejection", event => {
            const reason = event.reason;
            addDiagnostic("Startup rejection", reason && reason.message ? reason.message : String(reason || "Unknown rejection"));
          });
          window.addEventListener("unhandledrejection", () => {
            // Avoid swallowing the error; this listener only records it.
          });

          window.setTimeout(() => {
            if (document.getElementById("loading-text") && !document.getElementById("load-error")) {
              loadingText.textContent = "STILL STARTING... (90% may be Unity initialization)";
              loadingText.style.fontSize = "24px";
              addDiagnostic(
                "Startup timeout",
                "Unity's progress callback stopped before startup completed. The HTML cannot safely skip this stage: Unity must finish creating its runtime. Common causes are memory pressure, a blocked framework file, or an incompatible WebAssembly/runtime asset."
              );
              const reloadButton = document.createElement("button");
              reloadButton.type = "button";
              reloadButton.textContent = "Retry game";
              reloadButton.style.cssText = "display:block;margin:12px auto;padding:10px 14px;font-size:14px;cursor:pointer;";
              reloadButton.onclick = () => location.reload();
              loadingText.insertAdjacentElement("afterend", reloadButton);
              const copyButton = document.createElement("button");
              copyButton.type = "button";
              copyButton.textContent = "Show / select diagnostic text";
              copyButton.style.cssText = "display:block;margin:12px auto;padding:10px 14px;font-size:14px;cursor:pointer;";
              copyButton.onclick = () => {
                const panel = document.getElementById("unity-diagnostics");
                if (panel) {
                  panel.style.userSelect = "text";
                  panel.style.background = "#000";
                  panel.scrollIntoView({block:"center"});
                }
              };
              loadingText.insertAdjacentElement("afterend", copyButton);
            }
          }, 45000);
        } catch (error) {
          showError(error && error.message ? error.message : String(error));
        }
      })();
    </script>
</body>
</html>
