
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Retro Bowl</title>

  <base href="https://cdn.jsdelivr.net/gh/wnasmile/LAMAR@main/retro-bowl/">

  <style>
    html, body {
      background: #000;
      color: #ccc;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .gm4html5_div_class {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      border: 0;
      image-rendering: optimizeSpeed;
      -ms-touch-action: none;
      touch-action: none;
    }

    :fullscreen #canvas,
    :-webkit-full-screen #canvas {
      width: 100%;
      height: 100%;
    }

<body>
  <div class="gm4html5_div_class" id="gm4html5_div_id">

      style="display:none"
    >

    <canvas id="canvas" width="960" height="540">
      Your browser does not support HTML5 canvas.
    </canvas>
  </div>

  <script src="html5game/RetroBowl.js?WAEAC=1633155445"></script>
  <script>
    window.onload = function () {
      if (typeof GameMaker_Init === "function") {
        GameMaker_Init();
      }
    };
  </script>
</body>
</html>
